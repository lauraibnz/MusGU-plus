---
####################################################################################################################################
# MusGU+ evaluation
# A Musician-Centered Evaluation Framework for Generative Music AI
####################################################################################################################################

project:
  name: Stable Audio 3
  affiliation: Stability AI
  architecture: latent diffusion
  applications: continuation, editing, text-to-music
  link: https://stability.ai/news-updates/meet-stable-audio-3-the-model-family-built-for-artistic-experimentation-with-open-weight-models
  repository: https://github.com/Stability-AI/stable-audio-3
  article: https://arxiv.org/abs/2605.17991
  checkpoints: https://huggingface.co/collections/stabilityai/stable-audio-3
  ui: https://huggingface.co/spaces/stabilityai/stable-audio-3
  notes: Evaluation focuses on the publicly released Stable Audio 3 models and workflows. The Small-Music and Medium models are available as open weights, while Large is API-only and is not supported by the repository.

adaptability:
  hardware_requirements:
    value: low
    notes: Although LoRA fine-tuning is provided, the released models remain large, and the available materials do not demonstrate that adaptation can be performed on CPU-only systems or consumer-grade GPUs within a practical timeframe for end users.

  dataset_size:
    value: low
    notes: The official materials do not document that Stable Audio 3 can be effectively fine-tuned using small personal datasets, nor do they establish a moderate dataset requirement. Without evidence of feasible adaptation from musician-sized datasets, dataset requirements remain unsupported from a musician-centered perspective.

  adaptation_pathways:
    value: high
    notes: The repository provides a dedicated LoRA fine-tuning workflow, including dataset preparation, training, checkpointing, and loading adapted LoRA checkpoints at inference time. Pretrained model checkpoints and autoencoders are also available.
    tags: LoRA, fine-tuning, pretrained checkpoints

  technical_barriers:
    value: low
    notes: Fine-tuning is performed through command-line tools and Python-based workflows. No graphical or notebook-based adaptation interface is provided, and users must configure the software environment, prepare data, and run training themselves.
    tags: CLI

  model_redistribution:
    value: partial
    notes: The Stability AI Community License permits users to create and distribute derivative works, including LoRAs and fine-tuned models. However, commercial use of these adapted models is subject to licensing conditions, including an annual revenue threshold above which an Enterprise License may be required.


controllability:
  conditioning_inputs:
    value: low
    notes: Stable Audio 3 conditions generation primarily through descriptive text prompts. Reference audio is used as source material for inpainting and continuation rather than as a separate musical conditioning modality for controlling attributes such as style, timbre, melody, or rhythm.
    tags: text

  time_varying_control:
    value: partial
    notes: Users can specify one or multiple temporal regions to regenerate through inpainting masks, while preserving the surrounding audio. This provides segment-level localized control, but not fine-grained control over musical attributes such as pitch, dynamics, rhythm, or structure over time.

  feature_disentanglement:
    value: low
    notes: The provided controls are not designed to independently manipulate distinct musical attributes. Text prompting and mask-based editing do not expose isolated controls for features such as timbre, pitch, rhythm, or structure.
    tags:

  control_parameters:
    value: partial
    notes: The released interface and inference workflow expose several configurable generation parameters, including duration, sampling steps, CFG scale, sampler, seed, and initialization noise level for audio editing. However, users are not given direct control over internal representations or musically interpretable latent dimensions.
    tags: duration, randomness, diffusion steps, sampling strategy, conditioning strength, latent noise

usability:
  interface_availability:
    value: high
    notes: Stable Audio 3 provides a publicly accessible Hugging Face Space with a graphical interface for text-to-audio generation. The repository also provides a local Gradio interface exposing additional generation and editing controls.
    tags: Hugging Face, Gradio

  access_restrictions:
    value: high
    notes: Open-weight Stable Audio 3 models are available with pretrained checkpoints and inference code, allowing unrestricted repeated local inference without subscriptions, usage quotas, or time limits. Although the Large model is API-only, the Small and Medium models can be run locally.

  realtime_capabilities:
    value: partial
    notes: Stable Audio 3 is optimized for very fast generation, with the released benchmarks reporting generation times of several seconds or less depending on model size, output duration, and hardware. However, it is not designed for continuous low-latency interaction or live musical control, and real-time-factor performance on modest hardware does not by itself constitute a live real-time system.

  workflow_integration:
    value: low
    notes: The released tools provide web, local Gradio, CLI, and Python inference workflows, but no direct integration with DAWs, visual programming environments, live coding systems, or dedicated music hardware is provided.
    tags:

  output_licensing:
    value: partial
    notes: Users may own, distribute, and commercialize generated outputs under the Stability AI Community License, but commercial use is subject to licensing conditions, including the annual revenue threshold for organizations using Stability AI models commercially.

  community_support:
    value: high
    notes: A public Harmonai Discord server is provided for users, with discussions and weekly office hours focused on AI audio and music.
    tags: Discord